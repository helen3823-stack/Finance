# E1 — Baseline + Decision Rule
# 질문: 가장 강한 기준선과 결정 규칙은 무엇인가?
# 복잡도 순서: k 1개 → 대칭 경계 2개 → 상승/하락 비대칭 → 경계 4개
# 실행: python -m exp run configs/e1_baseline.toml
# 2026-10-06 수정: 회귀 신호(regress)의 k 탐색 상한 8 → 16. E3 에서 여러 분할의 k 가 상한 8.0 에 닿아
#   회귀 신호가 불리하게 평가됐을 수 있어 범위만 넓힘 (k 는 여전히 학습 구간 안에서 고름). 갭 규칙 후보는 그대로

name = "e1_baseline"
stage = "E1"
seed = 20261005

[data]
groups = ["core", "scale", "cross", "event", "regime"]

[eval]
baseline = "B2"
bootstrap = 1000
block_days = 5

[[candidates]]
name = "B0"
signal = { type = "gap" }
decision = { type = "flat" }

[[candidates]]
name = "B1"
signal = { type = "gap" }
decision = { type = "identity" }

[[candidates]]
name = "B2"
signal = { type = "gap" }
decision = { type = "k" }

[[candidates]]
name = "B2-Sym"
signal = { type = "gap" }
decision = { type = "sym2" }

[[candidates]]
name = "B2-Asym"
signal = { type = "gap" }
decision = { type = "asym" }

[[candidates]]
name = "B2-4T"
signal = { type = "gap" }
decision = { type = "4t" }

[[candidates]]
name = "B3"
signal = { type = "regress", features = ["core"] }
decision = { type = "k", params = { k_grid = [0.5, 16.0, 0.25] } }

[[candidates]]
name = "B4"
signal = { type = "classify5", features = ["core"] }
decision = { type = "4t" }
